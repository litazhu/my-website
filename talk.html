<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝说 · 听音识图（语音版）</title>
<style>
  :root {
    --bg: #fff8f0;
    --card: #ffffff;
    --ink: #3a2e39;
    --muted: #a08a86;
    --line: #f0e4dc;
    --accent: #ff8a5c;
    --shadow: 0 14px 40px rgba(255,138,92,.16), 0 4px 12px rgba(58,46,57,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fff8f0 0%, #fff1f5 50%, #f3f6ff 100%);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }

  /* nav */
  .nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .nav a {
    text-decoration: none; font-size: 13px; font-weight: 700; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
    transition: all .15s ease;
  }
  .nav a:hover { border-color: #ffd0b8; color: var(--ink); }
  .nav a.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  header { text-align: center; margin-bottom: 16px; }
  header .logo {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .3px; margin-bottom: 8px;
  }
  header .logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  header p { color: var(--muted); font-size: 14px; margin-top: 7px; line-height: 1.7; }

  /* mic status bar */
  .status {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 6px auto 18px; max-width: 480px;
    padding: 12px 18px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line);
    font-size: 14px; font-weight: 700; color: var(--muted);
  }
  .status .dot {
    width: 12px; height: 12px; border-radius: 50%; background: #d6cfc9; flex-shrink: 0;
    transition: background .2s ease;
  }
  .status.listening .dot { background: #f43f5e; animation: pulse 1.1s ease infinite; }
  .status.matched .dot { background: #16a34a; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(244,63,94,.45); }
    70% { box-shadow: 0 0 0 12px rgba(244,63,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); }
  }
  .status .live { font-weight: 600; color: #c9a894; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* stage */
  .stage { position: relative; margin: 0 auto; max-width: 480px; }
  .stage .frame {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    border-radius: 32px; overflow: hidden; background: #fff6ec;
    box-shadow: var(--shadow); border: 1px solid #fff;
  }
  .stage img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .5s ease;
  }
  .stage .tag {
    position: absolute; top: 16px; left: 16px; z-index: 3;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 800; padding: 6px 13px; border-radius: 999px; color: #fff;
    background: var(--accent); box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }

  .word {
    text-align: center; margin: 18px 0 4px;
  }
  .word .zh { font-size: 46px; font-weight: 800; letter-spacing: 2px; }
  .word .en { font-size: 26px; color: var(--muted); font-weight: 700; margin-top: 2px; }

  /* controls */
  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .15s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: #ffd0b8; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.mic { background: #fff1e8; color: #e9632f; border-color: #ffd0b8; }
  .btn.mic.on { background: #ffe4e6; color: #e11d48; border-color: #fecdd3; }
  .btn.speak { background: #fff1e8; color: #e9632f; border-color: #ffd0b8; }
  .btn.random { background: #eef2ff; color: #4f46e5; border-color: #c7d2fe; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 24px 0 10px; }
  .chip {
    border: 1.5px solid var(--line); background: #fff; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { border-color: #ffd0b8; color: var(--ink); transform: translateY(-1px); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* word grid (tap fallback) */
  .grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .word-btn {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    padding: 9px 13px; border-radius: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all .15s ease;
  }
  .word-btn small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 1px; }
  .word-btn:hover { border-color: #ffd0b8; transform: translateY(-1px); }
  .word-btn.current { background: var(--ink); color: #fff; border-color: var(--ink); }
  .word-btn.current small { color: #d8cfe0; }

  footer { text-align: center; margin-top: 26px; font-size: 12.5px; color: #c9b6ae; line-height: 2; }
  kbd {
    background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 1px 6px; font-size: 11.5px; font-family: inherit; color: var(--muted);
  }

  @media (max-width: 560px) {
    .word .zh { font-size: 40px; }
    .stage .frame { border-radius: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">

    <button class="btn random" id="btnRandom">🔀 换一个</button>

  </div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>

  <footer>
    <kbd>空格</kbd> 换一个 &nbsp;·&nbsp; <kbd>S</kbd> 朗读 &nbsp;·&nbsp; <kbd>M</kbd> 开关麦克风 &nbsp;·&nbsp; <kbd>L</kbd> 切换语言<br>
    语音识别需 <b>Chrome 浏览器</b> 并允许麦克风权限
  </footer>
</div>

// 语音识别别名（按图片文件名索引，补充中文叠词/常见说法）
const ALIASES = {
  "imgs/dog.png": ["狗狗","小狗"], "imgs/cat.png": ["猫猫","小猫"],
  "imgs/cow.png": ["奶牛","牛牛"], "imgs/pig.png": ["猪猪","小猪"],

  "imgs/fish.png": ["鱼鱼"], "imgs/bird.png": ["小鸟","鸟鸟"],
  "imgs/lion.png": ["狮"], "imgs/monkey.png": ["猴","小猴"], "imgs/frog.png": ["蛙"],
  "imgs/turtle.png": ["龟"], "imgs/apple.png": ["果果"], "imgs/banana.png": ["蕉"],

  "imgs/grape.png": ["葡萄"], "imgs/watermelon.png": ["西瓜","瓜"], "imgs/carrot.png": ["萝卜"],

  "imgs/eyes.png": ["眼睛","眼"], "imgs/nose.png": ["鼻子","鼻"], "imgs/mouth.png": ["嘴巴","嘴"],

// 为每张卡构建关键词列表
CARDS.forEach(card => {
  card.keywords = [card.zh, card.en.toLowerCase()].concat(ALIASES[card.img] || []);
});

// ---- state ----
let current = CARDS[0];
let variants = [];
let vIdx = 0;
let cycleTimer = null;
let currentEl = "A"; // 当前显示的是 A 还是 B
let listening = false;
let currentLang = "zh-CN";
let activeCat = "all";
let rec = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const $ = id => document.getElementById(id);

function showImage(src) {
  const el = (currentEl === "A") ? $("imgB") : $("imgA");
  const old = (currentEl === "A") ? $("imgA") : $("imgB");
  el.src = src;
  el.style.opacity = "1";
  old.style.opacity = "0";
  currentEl = (currentEl === "A") ? "B" : "A";
}

function restartCycle() {
  clearInterval(cycleTimer);
  cycleTimer = setInterval(() => {
    vIdx = (vIdx + 1) % variants.length;
    showImage(variants[vIdx]);
  }, 1500);
}

function audioId(card) {
  return card.img.replace(/^imgs\//, '').replace(/\.png$/, '');
}
function speakWord(card) {
  if (window._curAudio) { try { window._curAudio.pause(); } catch(e){} window._curAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const cn = new Audio("imgs/audio/" + audioId(card) + "_cn.m4a");
  const en = new Audio("imgs/audio/" + audioId(card) + "_en.m4a");
  let fellBack = false;
  const fallback = () => {
    if (fellBack || !('speechSynthesis' in window)) return;
    fellBack = true;
    const u1 = new SpeechSynthesisUtterance(card.zh);
    u1.lang = 'zh-CN'; u1.rate = 0.8;
    const u2 = new SpeechSynthesisUtterance(card.en);
    u2.lang = 'en-US'; u2.rate = 0.8;
    u1.onend = () => speechSynthesis.speak(u2);
    speechSynthesis.speak(u1);
  };
  window._curAudio = cn;
  cn.onerror = fallback;
  cn.onended = () => { window._curAudio = en; en.onerror = fallback; en.play(); };
  cn.play().catch(fallback);
}

function setWord(card) {
  current = card;
  variants = [card.img, card.img.replace('.png','_2.png'), card.img.replace('.png','_3.png'), card.img.replace('.png','_4.png')];
  variants.forEach(src => { const im = new Image(); im.src = src; });
  vIdx = 0;
  showImage(variants[0]);
  $("wordZh").textContent = card.zh;
  $("wordEn").textContent = card.en;
  $("tag").textContent = CATS[card.c].label;
  $("tag").style.background = CATS[card.c].color;
  restartCycle();
  highlightGrid();
}

function flash(text) {
  const st = $("statusText");
  st.textContent = text;
  $("status").classList.add("matched");
  setTimeout(() => { if (listening) $("status").classList.remove("matched"); }, 1200);
}

// ---- word grid ----
function buildChips() {
  const chips = $("chips");
  chips.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip active"; all.textContent = "全部 " + CARDS.length;
  all.onclick = () => { activeCat = "all"; refreshChips(); renderGrid(); };
  chips.appendChild(all);
  Object.keys(CATS).forEach(k => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = CATS[k].label;
    b.onclick = () => { activeCat = k; refreshChips(); renderGrid(); };
    chips.appendChild(b);
  });
}
function refreshChips() {
  const keys = ["all", ...Object.keys(CATS)];
  [...$("chips").children].forEach((ch, i) => ch.classList.toggle("active", keys[i] === activeCat));
}
function renderGrid() {
  const grid = $("grid");
  grid.innerHTML = "";
  const list = activeCat === "all" ? CARDS : CARDS.filter(d => d.c === activeCat);
  list.forEach(card => {
    const b = document.createElement("button");
    b.className = "word-btn";
    b.innerHTML = card.zh + "<small>" + card.en + "</small>";
    b.onclick = () => setWord(card);
    grid.appendChild(b);
  });
  highlightGrid();
}
function highlightGrid() {
  [...$("grid").children].forEach((b, i) => {
    const list = activeCat === "all" ? CARDS : CARDS.filter(d => d.c === activeCat);
    b.classList.toggle("current", list[i] === current);
  });
}

// ---- voice recognition ----
function initRec() {
  if (!SR) return false;
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 3;
  rec.lang = currentLang;
  rec.onresult = handleResult;
  rec.onerror = handleError;
  rec.onend = () => { if (listening) { try { rec.start(); } catch(e){} } };
  return true;
}

function matchWord(transcript) {
  const t = transcript.toLowerCase().replace(/[，。！？、,.!?\s]/g, '');
  let best = null, bestLen = 0;
  for (const card of CARDS) {
    for (const kw of card.keywords) {
      const k = kw.toLowerCase().replace(/\s/g, '');
      if (k && t.includes(k) && k.length > bestLen) {
        best = card; bestLen = k.length;
      }
    }
  }
  return best;
}

function handleResult(e) {
  let final = "", interim = "";
  for (let i = e.resultIndex; i < e.results.length; i++) {
    const r = e.results[i];
    if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
  }
  if (interim && !final) $("statusText").textContent = "听到：" + interim.trim();
  if (final) {
    const matched = matchWord(final);
    if (matched && matched !== current) {
      setWord(matched);
      speakWord(matched);
      flash("🎉 识别到「" + matched.zh + "」" + matched.en);
    } else {
      $("statusText").textContent = "听到：" + final.trim();
    }
  }
}

function handleError(e) {
  if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
    listening = false; updateMicUI();
    flash("⚠️ 麦克风权限被拒绝");
    $("statusText").textContent = "请允许麦克风权限后重试";
  } else if (e.error === 'no-speech') {
    if (listening) $("statusText").textContent = "没听清，再说一次～";
  }
  // 其他错误静默，onend 会自动重启
}

function startMic() {
  if (!SR) { flash("⚠️ 此浏览器不支持语音识别"); return; }
  if (!rec) initRec();
  if (!rec) return;
  rec.lang = currentLang;
  try { rec.start(); listening = true; updateMicUI(); } catch(e) {}
}
function stopMic() {
  listening = false;
  if (rec) { try { rec.stop(); } catch(e){} }
  updateMicUI();
}
function updateMicUI() {
  const b = $("btnMic");
  b.classList.toggle("on", listening);
  b.textContent = listening ? "🔴 停止听" : "🎤 开始听";
  $("status").classList.toggle("listening", listening);
  if (listening) $("statusText").textContent = "正在聆听… 说一个词吧";
  else $("statusText").textContent = "点击「🎤 开始听」试试";
}
function toggleMic() { listening ? stopMic() : startMic(); }
function toggleLang() {
  currentLang = (currentLang === "zh-CN") ? "en-US" : "zh-CN";
  $("btnLang").textContent = (currentLang === "zh-CN") ? "中文 🇨🇳" : "English 🇺🇸";
  if (listening && rec) {
    try { rec.stop(); } catch(e){}
    rec.lang = currentLang;
    try { rec.start(); } catch(e){}
  }
}
function randomWord() {
  const card = CARDS[Math.floor(Math.random() * CARDS.length)];
  setWord(card);
  if (!listening) { speakWord(card); }
}

// ---- events ----
$("btnMic").addEventListener("click", toggleMic);
$("btnLang").addEventListener("click", toggleLang);
$("btnRandom").addEventListener("click", randomWord);
$("btnSpeak").addEventListener("click", () => speakWord(current));

document.addEventListener("keydown", e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); randomWord(); }
  else if (e.key === "s" || e.key === "S") speakWord(current);
  else if (e.key === "m" || e.key === "M") toggleMic();
  else if (e.key === "l" || e.key === "L") toggleLang();
});

// ---- boot ----
buildChips();
renderGrid();
setWord(current);
</script>
</body>
</html>
