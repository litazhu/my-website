<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fast.ai 深度学习闪卡体验 · aiquizzes</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1e2430;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #6366f1;
    --green: #16a34a;
    --red: #e11d48;
    --shadow: 0 10px 30px rgba(30,36,48,.08), 0 2px 8px rgba(30,36,48,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }

  header { text-align: center; margin-bottom: 24px; }
  header .logo {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .3px; margin-bottom: 10px;
  }
  header .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  header h1 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  header p { color: var(--muted); font-size: 14.5px; margin-top: 8px; line-height: 1.6; }
  header p a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .nav { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .nav a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
    text-decoration: none; transition: all .15s ease;
    border: 1px solid var(--line); color: var(--muted); background: #fff;
  }
  .nav a:hover { border-color: #c7cbf4; color: var(--ink); }
  .nav a.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Filter chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 26px 0 8px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; user-select: none;
  }
  .chip:hover { border-color: #c7cbf4; color: var(--ink); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .n { opacity: .6; font-weight: 500; margin-left: 3px; }

  /* Progress */
  .progress-row { display: flex; align-items: center; gap: 12px; margin: 18px 0 22px; }
  .progress-bar { flex: 1; height: 8px; background: #e9ebf2; border-radius: 999px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), #8b5cf6); border-radius: 999px; transition: width .3s ease; }
  .counter { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .counter b { color: var(--ink); }

  /* Card */
  .scene { perspective: 1600px; margin: 0 auto; max-width: 640px; }
  .card {
    position: relative; width: 100%; height: 360px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.1,.2,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    padding: 40px 38px; display: flex; flex-direction: column;
    border: 1px solid var(--line);
  }
  .face.back { transform: rotateY(180deg); }

  .face .tag {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
    color: #fff; margin-bottom: 18px;
  }
  .face .q-label, .face .a-label {
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin-bottom: 12px;
  }
  .face .q-text { font-size: 21px; font-weight: 700; line-height: 1.55; }
  .face .a-text { font-size: 17.5px; font-weight: 500; line-height: 1.7; color: #2a3140; overflow-y: auto; }
  .face .hint { margin-top: auto; font-size: 12.5px; color: #9ca3af; text-align: center; }
  .hint kbd {
    background: #f1f2f6; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 2px 7px; font-size: 11.5px; font-family: inherit; color: var(--muted);
  }

  /* Controls */
  .controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 28px; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 11px 20px; border-radius: 12px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; user-select: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: #c7cbf4; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #14171f; }
  .btn.icon { padding: 11px 13px; }

  /* Mark buttons (answer side footer) */
  .mark-row { display: flex; gap: 10px; margin-top: 18px; }
  .mark-btn {
    flex: 1; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 700;
    border: 1px solid transparent; cursor: pointer; transition: all .15s ease;
  }
  .mark-btn.know { background: #ecfdf3; color: var(--green); border-color: #bbf7d0; }
  .mark-btn.know:hover { background: #d1fae5; }
  .mark-btn.dunno { background: #fff1f2; color: var(--red); border-color: #fecdd3; }
  .mark-btn.dunno:hover { background: #ffe4e6; }

  /* Score summary */
  .score { display: flex; justify-content: center; gap: 18px; margin-top: 20px; font-size: 13px; color: var(--muted); }
  .score span b { font-size: 15px; }
  .score .s-know b { color: var(--green); }
  .score .s-dunno b { color: var(--red); }

  footer { text-align: center; margin-top: 34px; font-size: 12.5px; color: #9ca3af; line-height: 1.9; }
  footer a { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 15px; }
  @media (max-width: 560px) {
    .face { padding: 28px 22px; }
    .card { height: 380px; }
    .face .q-text { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>aiquizzes · fast.ai</div>
    <h1>深度学习闪卡体验</h1>
    <p>79 张问答卡，来自 <a href="https://github.com/radekosmulski/aiquizzes-anki" target="_blank">aiquizzes-anki</a><br>点击卡片翻面查看答案 · 用「认识 / 还不熟」跟踪掌握度</p>
    <div class="nav">
      <a class="active" href="./index.html">📚 深度学习闪卡</a>
      <a href="./baby.html">🍼 宝宝 First Words</a>
      <a href="./talk.html">🗣️ 宝宝说 · 听音识图</a>
    </div>
  </header>

  <div class="chips" id="chips"></div>

  <div class="progress-row">
    <div class="progress-bar"><div class="fill" id="bar" style="width:0%"></div></div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front" id="front">
        <span class="tag" id="tagFront">训练</span>
        <div class="q-label">问题</div>
        <div class="q-text" id="qText"></div>
        <div class="hint">点击翻面 · <kbd>空格</kbd> 翻面</div>
      </div>
      <div class="face back" id="back">
        <span class="tag" id="tagBack">训练</span>
        <div class="a-label">答案</div>
        <div class="a-text" id="aText"></div>
        <div class="mark-row">
          <button class="mark-btn know" id="btnKnow">✓ 认识了</button>
          <button class="mark-btn dunno" id="btnDunno">✗ 还不熟</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn icon" id="btnPrev" title="上一张">←</button>
    <button class="btn primary" id="btnFlip">翻面看答案</button>
    <button class="btn icon" id="btnNext" title="下一张">→</button>
    <button class="btn" id="btnShuffle" title="随机打乱">🔀 打乱</button>
  </div>

  <div class="score">
    <span class="s-know">已认识 <b id="scKnow">0</b></span>
    <span class="s-dunno">待复习 <b id="scDunno">0</b></span>
    <span>未标记 <b id="scRest">0</b></span>
    <span style="cursor:pointer;color:var(--accent);font-weight:600" id="btnReset">重置进度</span>
  </div>

  <footer>
    <kbd>空格</kbd> 翻面 &nbsp;·&nbsp; <kbd>←</kbd>/<kbd>→</kbd> 切换卡片 &nbsp;·&nbsp; <kbd>1</kbd> 认识 &nbsp;·&nbsp; <kbd>2</kbd> 还不熟<br>
    数据来源：<a href="https://github.com/radekosmulski/aiquizzes-anki" target="_blank">radekosmulski/aiquizzes-anki</a>
  </footer>
</div>

<script>
const CATS = {
  train:   { label: "训练与过拟合", color: "#e11d48" },
  pytorch: { label: "PyTorch",       color: "#ee4c2c" },
  python:  { label: "Python 技巧",   color: "#2563eb" },
  stats:   { label: "统计基础",      color: "#7c3aed" },
  norm:    { label: "归一化 BN/LN",  color: "#0d9488" },
  augment: { label: "数据增强",      color: "#16a34a" },
  tricks:  { label: "训练技巧",      color: "#d97706" },
  arch:    { label: "模型架构",      color: "#db2777" },
  lstm:    { label: "LSTM",          color: "#4f46e5" },
  meta:    { label: "科研与调试",    color: "#64748b" },
};

const CARDS = [
  { c:"train", q:"刚开始解决一个新问题、着手构建模型时，最应该先关注什么？", a:"确保你的模型能够过拟合（overfit）。" },
  { c:"train", q:"模型「过拟合」（overfit）具体指什么？", a:"你亲眼看到验证误差在变差。" },
  { c:"train", q:"已经有了一个过拟合的模型，为了最大化它的性能，应按什么顺序尝试哪些操作？", a:"更多数据 → 数据增强 → 寻找可泛化的架构 → 添加正则化 → 降低架构复杂度。" },
  { c:"pytorch", q:"一段代码用 val 与 ary 直接比较，却不复制、也不额外占内存，靠的是什么机制？", a:"广播（broadcasting）——让 val 在内存中看起来与 ary 形状匹配，作为单个向量化操作进行比较。" },
  { c:"pytorch", q:"让矩阵 a 在内存中「看起来」与矩阵 b 形状匹配的过程叫什么？", a:"广播（broadcasting）。" },
  { c:"pytorch", q:"a[None] 或 a.unsqueeze(0) 这类操作的效果是什么？", a:"在位置 0 创建一个新的轴。" },
  { c:"train", q:"归一化数据时，应该用哪个数据集（训练 / 验证 / 测试）来计算均值和标准差？", a:"只用训练集来计算均值和标准差。" },
  { c:"arch", q:"研究表明，训练 10,000 层深度神经网络的诀窍是什么？", a:"初始化（initialization）。" },
  { c:"arch", q:"初始化用于乘以 ReLU 激活的权重时，需要额外采取预防措施吗？", a:"需要——公式里要计入 ReLU 之后方差减半的情况。" },
  { c:"pytorch", q:"调用 tensor.squeeze() 时，显式指定要压缩的维度有优势吗？", a:"有。否则 squeeze 会移除所有单位轴，可能引发 bug（例如无法对单个样本做预测）。" },
  { c:"pytorch", q:"连续多次调用 backward() 会发生什么？", a:"梯度会被累积（多次调用之间的梯度求和）。" },
  { c:"python", q:"想在给 Python 对象的属性赋值时触发某些逻辑，需要重写哪个方法？", a:"__setattr__ 方法。" },
  { c:"pytorch", q:"取特定位置的值再求和，逐元素乘法 vs 索引，哪种更快？", a:"方法 #2（索引）更快。" },
  { c:"tricks", q:"计算很大的浮点数时，可能发生什么？", a:"可能引入不准确——离 0 越远，数字的精度（精细度）越低。" },
  { c:"tricks", q:"LogSumExp 技巧的好处是什么？", a:"让我们在更小的浮点数上运算，从而解决数值稳定性问题。" },
  { c:"python", q:"Python 中 for x in something_else 背后发生了什么？", a:"在 something_else 上调用 __iter__，每次迭代在返回的迭代器上调用 next()。" },
  { c:"pytorch", q:"torch.randperm(v) 做什么？", a:"返回 0 到 v-1 的随机排列。" },
  { c:"pytorch", q:"model.train() 和 model.eval() 分别做什么？", a:"model.train() 把 model.training 设为 True；model.eval() 设为 False。" },
  { c:"train", q:"fast.ai 训练循环里的 proclaim_victory 是什么？", a:"一个回调（callback）。" },
  { c:"python", q:"若对象有 val 属性就访问它、否则返回默认值 False，怎么写？", a:"getattr(something, 'val', False)。" },
  { c:"python", q:"getattr(something, 'val', 100) 当属性不存在时会返回什么？", a:"返回 100。" },
  { c:"python", q:"什么是装饰器（decorator）？", a:"一个返回函数的函数；一种让代码更可读、更简洁的机制；一个以函数为参数的函数。" },
  { c:"python", q:"要像 fast.ai 那样 monkey-patch torch.Tensor，横线处该填什么（tensor.____ = ...）？", a:"property。" },
  { c:"meta", q:"跟不上 fast.ai 课程里的所有内容，需要担心吗？", a:"不用担心——Jeremy 故意在讲座里塞了足够忙到明年课程开始的内容。" },
  { c:"train", q:"为什么回调（callback）对研究者来说很棒？", a:"它让你能快速调整、快速构建实验，非常适合做迭代实验。" },
  { c:"python", q:"什么是闭包（closure）？", a:"一个函数，它保存了函数创建时来自外部上下文的一些信息。" },
  { c:"python", q:"Python 中减少函数参数数量、把某些参数设为预设值的机制叫什么？", a:"Partials（偏函数）。" },
  { c:"python", q:"定义哪个方法能让 Python 对象可调用（callable）？", a:"__call__。" },
  { c:"python", q:"定义哪个方法能让 Python 对象可下标访问（subscriptable）？", a:"__getitem__。" },
  { c:"python", q:"想指定终结器（finalizer），需要定义哪个方法？", a:"__del__。" },
  { c:"python", q:"想指定 with 语句进入对象上下文时的行为，需要定义哪个方法？", a:"__enter__。" },
  { c:"python", q:"返回对象长度的 dunder 方法叫什么？", a:"__len__。" },
  { c:"python", q:"理想情况下应返回可用于重建对象的字符串表示的方法是什么？", a:"__repr__。" },
  { c:"python", q:"应计算对象「非正式」/ 美观可打印字符串表示的方法是什么？", a:"__str__。" },
  { c:"python", q:"要实现类实例之间的加法，需要定义什么？", a:"__add__。" },
  { c:"stats", q:"方差（variance）非正式地衡量什么？", a:"一组数字相对其均值的离散程度。" },
  { c:"stats", q:"一组 |x - mean| 的平均值计算的是什么？", a:"平均绝对偏差（mean absolute deviation）。" },
  { c:"stats", q:"标准差如何计算？", a:"它是方差的平方根。" },
  { c:"stats", q:"平均绝对偏差 vs 标准差，哪个对异常值更敏感？", a:"标准差比平均绝对偏差对异常值更敏感。" },
  { c:"stats", q:"为什么数学家和统计学家比平均绝对偏差更常使用标准差？", a:"它让证明（推导）更容易。" },
  { c:"stats", q:"什么是协方差（covariance）？", a:"衡量两个事物以相同方式变化的程度（一个变大时另一个也变大）。" },
  { c:"stats", q:"(a - a.mean()) * (b - b.mean()) 的平均值计算的是什么？", a:"协方差（covariance）。" },
  { c:"stats", q:"什么是皮尔逊相关系数？", a:"两个变量之间线性相关性的度量。" },
  { c:"arch", q:"什么时候该 / 不该用 softmax？", a:"除非每个条目有且仅有一个你所关心类别的样本，否则 softmax 是个糟糕的选择。" },
  { c:"arch", q:"分类时，对「不属于任何类别」的数据条目，好的处理方式是什么？", a:"把类别的存在性当作二项分布——所有低于阈值的值都等于「无类别」。" },
  { c:"norm", q:"训练期间 BatchNorm 层用于归一化的均值和标准差，是在什么上计算的？", a:"仅在当前正在训练的那一个 batch 上计算。" },
  { c:"arch", q:"在单通道图像上跑 3x3 卷积，为什么选 8 个通道有问题？", a:"8 个通道太多了——从描述 patch 的 9 个数变成 8 个，减少太小，等于没做有用计算、只是重排了数字。" },
  { c:"pytorch", q:"在继承自 nn.Module 的类中，self.register_buffer 做什么？", a:"把模块移到 GPU 时缓冲区也会跟着移过去；保存模块时缓冲区也会被保存。" },
  { c:"pytorch", q:"如何在 PyTorch 中只跟踪一个值，就计算指数衰减的移动平均？", a:"用 torch.lerp 计算指数移动平均。" },
  { c:"norm", q:"BatchNorm 的主要局限是什么？", a:"不能用于在线训练（batch size 为 1）；小 batch 时无法训练或不稳定；对 RNN 也有问题（变长序列 + 权重共享的批次如何归一化）。" },
  { c:"norm", q:"LayerNorm 与 BatchNorm 有何不同？", a:"均值和标准差取自每个输入的所有通道；不再跟踪运行均值。有帮助但不如 BN（会丢失如晴天 vs 雾天这类信息），但它是 RNN 必须用的。" },
  { c:"norm", q:"解决影响 BatchNorm 的小 batch 问题的两种方法是什么？", a:"更大的 epsilon；运行 BatchNorm（running BN）。" },
  { c:"norm", q:"指数移动平均语境下，「去偏」/ 偏差校正是什么意思？", a:"初始均值被初始化为 0，这对前几个样本影响很大；「去偏」就是纠正这一点。" },
  { c:"arch", q:"什么是 LSUV（逐层顺序单位方差）？", a:"随意初始化权重 → 取一个小 batch、找出所有 conv 层 → 把 batch 过每个模块算激活的均值/方差 → 循环迭代修改权重，直到均值≈0 且标准差≈1。" },
  { c:"meta", q:"在任何给定领域精通深度学习的一个重要部分是什么？", a:"知道如何创建小型、可用、有用的数据集。" },
  { c:"python", q:"在 Python 中要快速处理文件 / 目录，应该用什么工具？", a:"os.scandir（扫描单个目录）和 os.walk（遍历目录树）。" },
  { c:"python", q:"sorted 能对什么排序？", a:"任何能计算 key 的东西（或有可用作 key 的属性），包括对象和函数。" },
  { c:"arch", q:"推理时可能遇到训练集中没有的类，一种处理方法是什么？", a:"创建一个 OTHER 类，并用能模拟测试时预期内容的东西填充它；若训练集类很多，把最少出现的类合并进 OTHER 是好候选。" },
  { c:"python", q:"如何在 Python 中创建类方法？", a:"用 @classmethod 装饰器。" },
  { c:"pytorch", q:"什么是 PyTorch hooks？", a:"可以注册在 Module 或 Tensor 上的函数；当 Module 上执行 forward / backward、或对 Tensor 计算梯度时被调用。" },
  { c:"norm", q:"L2 正则化与 BatchNorm 一起使用，还有正则化效果吗？", a:"没有。" },
  { c:"tricks", q:"什么是 LAMB？", a:"按层（per-layer）进行平均的 ADAM。" },
  { c:"augment", q:"为训练调整图像大小时，该用哪种下采样算法——最近邻还是双线性？", a:"处理 / 增强数据时，始终查看代码结果；对视觉而言抗锯齿可能丢掉有用信息，最好用最近邻或尝试其他方法。" },
  { c:"tricks", q:"在 Byte 还是 Float 张量上运算更快？", a:"Byte 张量上的操作快得多，但要小心不要引入舍入误差或饱和问题。" },
  { c:"augment", q:"一种可跨多个领域应用的极有用数据增强技术是什么？", a:"RandomResizedCrop 的某种变体。" },
  { c:"augment", q:"一般来说，反射填充（reflection padding）对模型有帮助吗？", a:"大多数情况下有帮助。" },
  { c:"meta", q:"调试 ML 代码很难，是否该严格遵循格式规范？格式化代码时应关注什么？", a:"应格式化代码以便更好地理解它；很多情况下严格遵循格式规范未必理想。" },

  { c:"augment", q:"什么是标签平滑（label smoothing）？", a:"要求模型对正确标签预测一个小于 1 的值；有正则化效果，对噪声标签训练很有帮助，与 mixup 搭配是很好的技术。" },
  { c:"tricks", q:"fp16 训练可快达 3 倍，所有计算都用半精度浮点完成吗？", a:"不能——fp16 不够准、梯度常被舍入为 0。前向 / 反向传播用 fp16，损失计算、梯度减法等转成 fp32。" },
  { c:"arch", q:"XResNet（基于 Bag of Tricks 论文）包含哪些主要改进？", a:"修改 stem（3 个 3x3 代替 1 个 7x7）；BN 有时初始化为 1、有时为 0；下采样恒等路径用 AvgPool(2x2)+1x1 Conv；stride 2 移到 3x3（原来在 1x1 上会丢 75% 信息）。" },
  { c:"meta", q:"成为高效研究者、或把代码投入生产时，最重要的技术是什么？", a:"重构（Refactoring）——迭代地 DRY 化代码，让它更易理解和复用。" },
  { c:"pytorch", q:"在 nn.Module 上调用什么，可把参数、注册缓冲区等导出为值字典？", a:"module.state_dict()（可用 torch.save 保存，用 load_state_dict 加载）。" },
  { c:"norm", q:"迁移学习时经常被忽视、且导致奇怪结果的主要原因之一是什么？", a:"BatchNorm！冻结模块后，它不再获得已习惯的均值 / 方差输入；做部分层训练时应先在新数据上微调 BN 层。" },
  { c:"meta", q:"Jeremy Howard 调试深度学习的建议是什么？", a:"首先别犯错——唯一办法是让代码足够简单以减少 bug；检查每个中间结果以确保没有错误。" },
  { c:"meta", q:"什么是科学日志（scientific journal）？", a:"追踪你在做什么、得到什么结果的方式；过去的伟大科学家靠它定位和跟进奇怪现象，有时只是摆弄就带来突破。" },
  { c:"lstm", q:"LSTM 单元内部的两个激活函数是什么？输入与权重矩阵相乘后发生了什么？", a:"sigmoid 和 tanh；乘完后与来自上一时间步的隐藏状态相加，结果切成四块、在单元内走不同路径。" },
  { c:"pytorch", q:"如何把张量分割成若干等大小的块？", a:"用 torch.chunk。" },
  { c:"lstm", q:"fast.ai 中的 AWD-LSTM 抓取哪个 / 哪些状态来做分类？", a:"所有状态的最大池化 + 平均池化，与最后状态拼接，全部送入分类器。" },
];

// ---- state ----
let deck = CARDS.slice();
let idx = 0;
let flipped = false;
let activeCat = "all";
let marks = {}; // card index -> 'know' | 'dunno'

const $ = id => document.getElementById(id);
const card = $("card");
const bar = $("bar");

function buildChips() {
  const counts = {};
  CARDS.forEach(d => counts[d.c] = (counts[d.c] || 0) + 1);
  const chips = $("chips");
  chips.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip active"; all.textContent = `全部 ${CARDS.length}`;
  all.onclick = () => setCat("all");
  chips.appendChild(all);
  Object.keys(CATS).forEach(k => {
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `${CATS[k].label} <span class="n">${counts[k] || 0}</span>`;
    b.onclick = () => setCat(k);
    chips.appendChild(b);
  });
}

function setCat(cat) {
  activeCat = cat;
  deck = cat === "all" ? CARDS.slice() : CARDS.filter(d => d.c === cat);
  idx = 0; flipped = false;
  [...$("chips").children].forEach((ch, i) => {
    const keys = ["all", ...Object.keys(CATS)];
    ch.classList.toggle("active", keys[i] === cat);
  });
  render();
}

function current() { return deck[idx]; }

function render() {
  if (!deck.length) {
    $("front").style.display = "none";
    $("back").style.display = "none";
    $("counter").innerHTML = "";
    bar.style.width = "0%";
    return;
  }
  $("front").style.display = "";
  $("back").style.display = "";
  const d = current();
  const cat = CATS[d.c];
  $("tagFront").textContent = cat.label;
  $("tagFront").style.background = cat.color;
  $("tagBack").textContent = cat.label;
  $("tagBack").style.background = cat.color;
  $("qText").textContent = d.q;
  $("aText").textContent = d.a;
  card.classList.toggle("flipped", flipped);
  $("btnFlip").textContent = flipped ? "← 看回问题" : "翻面看答案";

  const total = deck.length;
  $("counter").innerHTML = `<b>${idx + 1}</b> / ${total}`;
  bar.style.width = ((idx + 1) / total * 100) + "%";
  updateScore();
}

function updateScore() {
  let know = 0, dunno = 0;
  deck.forEach((_, i) => { if (marks[i] === "know") know++; else if (marks[i] === "dunno") dunno++; });
  $("scKnow").textContent = know;
  $("scDunno").textContent = dunno;
  $("scRest").textContent = deck.length - know - dunno;
}

function flip() {
  if (!deck.length) return;
  flipped = !flipped;
  card.classList.toggle("flipped", flipped);
  $("btnFlip").textContent = flipped ? "← 看回问题" : "翻面看答案";
}

function go(dir) {
  if (!deck.length) return;
  idx = (idx + dir + deck.length) % deck.length;
  flipped = false;
  render();
}

function mark(kind) {
  marks[idx] = kind;
  render();
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0; flipped = false;
  render();
}

function reset() {
  marks = {};
  idx = 0; flipped = false;
  render();
}

// events
card.addEventListener("click", flip);
$("btnFlip").addEventListener("click", e => { e.stopPropagation(); flip(); });
$("btnPrev").addEventListener("click", () => go(-1));
$("btnNext").addEventListener("click", () => go(1));
$("btnShuffle").addEventListener("click", shuffle);
$("btnReset").addEventListener("click", reset);
$("btnKnow").addEventListener("click", e => { e.stopPropagation(); mark("know"); });
$("btnDunno").addEventListener("click", e => { e.stopPropagation(); mark("dunno"); });

document.addEventListener("keydown", e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "1") mark("know");
  else if (e.key === "2") mark("dunno");
});

buildChips();
render();
</script>
</body>
</html>
